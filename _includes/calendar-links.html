{% assign cal_src = site.data.site.calendar_src %}
<a
  class="btn btn-ghost"
  href="https://calendar.google.com/calendar/embed?src={{ cal_src }}&ctz=Europe%2FIstanbul"
  target="_blank"
  rel="noopener noreferrer"
>
  Open calendar
</a>
<a
  class="btn btn-ghost"
  href="https://calendar.google.com/calendar/u/0?cid={{ cal_src }}"
  target="_blank"
  rel="noopener noreferrer"
>
  Subscribe
</a>
