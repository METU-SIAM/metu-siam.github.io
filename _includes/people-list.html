{% assign people = include.people %}
<div class="people-list" role="list">
  {% for person in people %}
    <article class="person" role="listitem">
      <h3 class="person-name">{{ person.name }}</h3>
      <p class="person-role">{{ person.role }}</p>
      {% if person.affiliation %}
        <p class="person-affiliation">{{ person.affiliation }}</p>
      {% endif %}
      {% if person.email %}
        <a class="person-email" href="mailto:{{ person.email }}">{{ person.email }}</a>
      {% endif %}
    </article>
  {% endfor %}
</div>
