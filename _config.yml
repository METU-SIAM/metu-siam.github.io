title: METU SIAM Student Chapter
tagline: Society for Industrial and Applied Mathematics at Middle East Technical University
description: >-
  The METU chapter of SIAM brings together students interested in applied
  mathematics, scientific computing, data science, and related areas.
  We organize seminars, workshops, and reading groups at the Institute of
  Applied Mathematics.
url: https://metu-siam.github.io
baseurl: ""
lang: en
timezone: Europe/Istanbul
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

logo: /assets/images/metu-siam-logo.png
author: METU SIAM Student Chapter
twitter:
  username: MetuSiam
  card: summary

social:
  name: METU SIAM Student Chapter
  links:
    - https://www.facebook.com/siammetu
    - https://www.instagram.com/siam_metu
    - https://twitter.com/MetuSiam
    - https://www.linkedin.com/in/metu-siam-student-chapter-4a88b8198

collections:
  seminars:
    output: false
  workshops:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/metu-siam-logo.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - .gitignore
